<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelID Scanner V2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🚀 TravelID Scanner</h2>
      <p class="subtitle">Scanner V2 - Production Ready</p>
    </div>
    
    <div class="content">
      <button id="scanBtn" class="scan-button">
        <span class="icon">🔍</span>
        <span class="text">Scan Page</span>
      </button>
      
      <div id="status" class="status hidden"></div>
      
      <div id="results" class="results hidden">
        <div class="result-item">
          <span class="label">Provider:</span>
          <span id="provider" class="value">—</span>
        </div>
        <div class="result-item">
          <span class="label">Fields Detected:</span>
          <span id="fieldCount" class="value">—</span>
        </div>
        <div class="result-item">
          <span class="label">Scan Duration:</span>
          <span id="scanDuration" class="value">—</span>
        </div>
        <div class="result-item">
          <span class="label">Field Types:</span>
          <span id="fieldTypes" class="value">—</span>
        </div>
      </div>

      <div id="apiStatus" class="api-status hidden"></div>
    </div>
    
    <div class="footer">
      <small>Detects booking fields • Sends to API</small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
