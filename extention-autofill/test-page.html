<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Booking Form - TravelID Scanner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    
    fieldset {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
    }
    
    legend {
      font-weight: 600;
      color: #667eea;
      padding: 0 10px;
      font-size: 18px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .required::after {
      content: " *";
      color: red;
    }
    
    .checkbox-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .checkbox-item input[type="checkbox"],
    .checkbox-item input[type="radio"] {
      width: auto;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
    }
    
    .dynamic-fields {
      display: none;
      animation: slideDown 0.3s ease;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .alert {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✈️ Flight Booking Form</h1>
    <p class="subtitle">Test page for TravelID Scanner Extension</p>
    
    <div class="alert">
      <strong>🔍 Test Instructions:</strong> Load the extension and click "Scan / Autofill" to test field detection.
    </div>
    
    <form id="bookingForm">
      <!-- Personal Information -->
      <fieldset>
        <legend>👤 Personal Information</legend>
        
        <div class="form-group">
          <label for="firstName" class="required">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required>
        </div>
        
        <div class="form-group">
          <label for="lastName" class="required">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required>
        </div>
        
        <div class="form-group">
          <label for="email" class="required">Email Address</label>
          <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="phone" class="required">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
        </div>
        
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob">
        </div>
      </fieldset>
      
      <!-- Flight Details -->
      <fieldset>
        <legend>✈️ Flight Details</legend>
        
        <div class="form-group">
          <label for="from" class="required">From</label>
          <input type="text" id="from" name="from" placeholder="Departure city" required>
        </div>
        
        <div class="form-group">
          <label for="to" class="required">To</label>
          <input type="text" id="to" name="to" placeholder="Destination city" required>
        </div>
        
        <div class="form-group">
          <label for="departDate" class="required">Departure Date</label>
          <input type="date" id="departDate" name="departDate" required>
        </div>
        
        <div class="form-group">
          <label for="travelClass">Travel Class</label>
          <select id="travelClass" name="travelClass">
            <option value="">Select class</option>
            <option value="economy">Economy</option>
            <option value="premium-economy">Premium Economy</option>
            <option value="business">Business</option>
            <option value="first">First Class</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Trip Type</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="radio" id="oneWay" name="tripType" value="one-way" checked>
              <label for="oneWay">One Way</label>
            </div>
            <div class="checkbox-item">
              <input type="radio" id="roundTrip" name="tripType" value="round-trip">
              <label for="roundTrip">Round Trip</label>
            </div>
            <div class="checkbox-item">
              <input type="radio" id="multiCity" name="tripType" value="multi-city">
              <label for="multiCity">Multi-City</label>
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label>Add-ons</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="extraBaggage" name="addons" value="baggage">
              <label for="extraBaggage">Extra Baggage</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="insurance" name="addons" value="insurance">
              <label for="insurance">Travel Insurance</label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="mealPreference" name="addons" value="meal">
              <label for="mealPreference">Meal Preference</label>
            </div>
          </div>
        </div>
      </fieldset>
      
      <!-- Payment Information -->
      <fieldset>
        <legend>💳 Payment Information</legend>
        
        <div class="form-group">
          <label for="cardNumber" class="required">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" required>
        </div>
        
        <div class="form-group">
          <label for="cardName" class="required">Name on Card</label>
          <input type="text" id="cardName" name="cardName" placeholder="Full name as on card" required>
        </div>
        
        <div class="form-group">
          <label for="expiryDate" class="required">Expiry Date</label>
          <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required>
        </div>
        
        <div class="form-group">
          <label for="cvv" class="required">CVV</label>
          <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="3" required>
        </div>
      </fieldset>
      
      <!-- Special Requests -->
      <fieldset>
        <legend>📝 Special Requests</legend>
        
        <div class="form-group">
          <label for="specialRequests">Additional Comments</label>
          <textarea id="specialRequests" name="specialRequests" rows="4" placeholder="Any special requirements or requests..."></textarea>
        </div>
        
        <div class="form-group">
          <div class="checkbox-item">
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Subscribe to newsletter for deals and offers</label>
          </div>
        </div>
      </fieldset>
      
      <!-- Dynamic Fields (appear on interaction) -->
      <div id="dynamicFields" class="dynamic-fields">
        <fieldset>
          <legend>👥 Additional Passenger</legend>
          
          <div class="form-group">
            <label for="passenger2FirstName">Passenger 2 - First Name</label>
            <input type="text" id="passenger2FirstName" name="passenger2FirstName" placeholder="First name">
          </div>
          
          <div class="form-group">
            <label for="passenger2LastName">Passenger 2 - Last Name</label>
            <input type="text" id="passenger2LastName" name="passenger2LastName" placeholder="Last name">
          </div>
        </fieldset>
      </div>
      
      <button type="button" id="addPassengerBtn">+ Add Another Passenger</button>
      <button type="submit">Book Flight</button>
    </form>
  </div>
  
  <script>
    // Add dynamic fields on button click (tests MutationObserver)
    document.getElementById('addPassengerBtn').addEventListener('click', function() {
      const dynamicFields = document.getElementById('dynamicFields');
      dynamicFields.style.display = 'block';
      this.style.display = 'none';
    });
    
    // Prevent actual form submission
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('This is a test form. Submission prevented.');
    });
    
    console.log('✅ Test booking form loaded. Use TravelID Scanner extension to scan this page.');
  </script>
</body>
</html>
